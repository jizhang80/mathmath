name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Core + app, Chromium + WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
      - name: Enable pnpm via corepack (packageManager pin)
        run: corepack enable pnpm && pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Format + lint
        run: pnpm format:check && pnpm lint
      - name: Typecheck + contract types up to date
        run: pnpm typecheck && pnpm gen:check
      - name: Unit + integration tests
        run: pnpm test
      - name: Install Playwright engines
        working-directory: web/app
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build + end-to-end (D29)
        run: pnpm e2e
        env:
          CI: "true"

  swift:
    # FROZEN native code (D50). Kept running unchanged until the branch ruleset is re-pointed.
    name: Swift (Core + App, iOS simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode 26 on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "using $XCODE"; sudo xcode-select -s "$XCODE"; xcodebuild -version
      - name: swift-format lint
        run: xcrun swift-format lint --strict --recursive --configuration .swift-format Packages App/Sources
      - name: Build core-cli
        run: swift build -c release --product core-cli --package-path Packages/Core
      - name: Pick a simulator
        id: sim
        run: |
          DEST="$(scripts/pick-simulator.sh)"; echo "dest=$DEST" >> "$GITHUB_OUTPUT"; echo "$DEST"
      - name: Core tests on the simulator (D29)
        working-directory: Packages/Core
        run: xcodebuild test -quiet -scheme Core-Package -destination "${{ steps.sim.outputs.dest }}" CODE_SIGNING_ALLOWED=NO
      - name: Rendering tests on the simulator
        working-directory: Packages/Rendering
        run: xcodebuild test -quiet -scheme Rendering -destination "${{ steps.sim.outputs.dest }}" CODE_SIGNING_ALLOWED=NO
      - name: App build on the simulator
        run: xcodebuild build -quiet -workspace App/mathmath.xcworkspace -scheme mathmath -destination "${{ steps.sim.outputs.dest }}" -configuration Debug -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.12"
          enable-cache: true
      - name: Simulator smoke (fresh install + v1→v2 migration, arbiter-03 § Q-G)
        run: scripts/sim-smoke.sh

  python:
    name: Python pipeline
    runs-on: macos-26  # the seam test runs core-cli, which needs the Swift toolchain
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
